apply plugin: 'com.android.application'

android {
    namespace "com.chobocho.cardgame"
    compileSdk 37
    buildToolsVersion '37.0.0'

    def versionPropsFile = file('versioninfo.properties')
    def Properties versionInfo = new Properties()

    if (versionPropsFile.canRead()) {
        versionInfo.load(new FileInputStream(versionPropsFile))
    } else {
        versionInfo['VERSION_HEADER'] = "0.1105"
        versionInfo['VERSION_CODE'] = 1
        versionInfo['MONTHLY_RELEASE_COUNT'] = 1
        versionInfo['BUILD_COUNT'] = 0
    }

    def versionHeader = versionInfo['VERSION_HEADER']
    def releaseVersionCode = versionInfo['VERSION_CODE'].toInteger()
    def versionCount = versionInfo['MONTHLY_RELEASE_COUNT'].toInteger()
    def buildCount = versionInfo['BUILD_COUNT'].toInteger()

    def taskName = gradle.startParameter.taskNames
    def addVersion = 1
    def isReleaseVersion = false

    if (":app:bundleRelease" in taskName) {
        println '---[bundleRelease]---'
        releaseVersionCode += addVersion
        versionCount += addVersion
        isReleaseVersion = true
    }

    buildCount += addVersion

    versionInfo['VERSION_HEADER'] = versionHeader.toString()
    versionInfo['VERSION_CODE'] = releaseVersionCode.toString()
    versionInfo['MONTHLY_RELEASE_COUNT'] = versionCount.toString()
    versionInfo['BUILD_COUNT'] = buildCount.toString()

    versionInfo.store(versionPropsFile.newWriter(), null)

    def date = new Date()
    def alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
    def thisYear =  alphabet.charAt(date.getYear() + 1900 - 2001)
    def thisMonth = alphabet.charAt(date.getMonth())

    println '-------------------'
    println taskName
    println "${versionHeader}.${thisYear}${thisMonth}${versionCount}.${buildCount}"
    println '-------------------'

    defaultConfig {
        applicationId "com.chobocho.cardgame"
        minSdkVersion 26
        targetSdkVersion 37
        versionCode releaseVersionCode
        versionName "${versionHeader}.${thisYear}${thisMonth}${versionCount}.${buildCount}"
        setProperty("archivesBaseName", "freecell_$versionName")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    compileSdkMinor 1

}

// Kotlin 1.8 merged the jdk7/jdk8 stdlib artifacts into kotlin-stdlib.
// AppCompat 1.7.0 transitively pulls the legacy kotlin-stdlib-jdk8:1.6.21,
// which duplicates classes from kotlin-stdlib:1.8.22. Align them to avoid
// the "Duplicate class kotlin.*" build failure.
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
